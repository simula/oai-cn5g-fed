services:
    gnbsim-vpp2:
        container_name: gnbsim-vpp2
        image: gnbsim:latest
        privileged: true
        environment:
            - MCC=242
            - MNC=88
            - GNBID=5
            - TAC=0x00a000
            - SST=222
            - SD=00007b
            - PagingDRX=v32
            - RANUENGAPID=0
            - IMEISV=35609204079514
            - MSIN=0000000032
            - RoutingIndicator=1234
            - ProtectionScheme=null
            - KEY=449c4b91aeacd0ace182cf3a5a72bfa1
            - OPc=9245cd6283cc53ce24ac1186a60dee6b
            - DNN=default
            - URL=http://www.asnt.org:8080/
            - NRCellID=1
            - USE_FQDN=no
            - NGAPPeerAddr=192.168.200.132
            - GTPuLocalAddr=192.168.202.142
            - GTPuIFname=eth1
        networks:
            public_net:
                ipv4_address: 192.168.200.142
            public_net_access:
                ipv4_address: 192.168.202.142
        healthcheck:
            test: /bin/bash -c "ip address show dev gtp-gnb"
            interval: 10s
            timeout: 5s
            retries: 5
    gnbsim-vpp3:
        container_name: gnbsim-vpp3
        image: gnbsim:latest
        privileged: true
        environment:
            - MCC=242
            - MNC=88
            - GNBID=5
            - TAC=0x00a000
            - SST=222
            - SD=00007b
            - PagingDRX=v32
            - RANUENGAPID=0
            - IMEISV=35609204079514
            - MSIN=0000000033
            - RoutingIndicator=1234
            - ProtectionScheme=null
            - KEY=449c4b91aeacd0ace182cf3a5a72bfa1
            - OPc=9245cd6283cc53ce24ac1186a60dee6b
            - DNN=default
            - URL=http://www.asnt.org:8080/
            - NRCellID=1
            - USE_FQDN=no
            - NGAPPeerAddr=192.168.200.132
            - GTPuLocalAddr=192.168.202.143
            - GTPuIFname=eth1
        networks:
            public_net:
                ipv4_address: 192.168.200.143
            public_net_access:
                ipv4_address: 192.168.202.143
        healthcheck:
            test: /bin/bash -c "ip address show dev gtp-gnb"
            interval: 10s
            timeout: 5s
            retries: 5
networks:
    public_net:
        name: demo-oai-public-net
        external: true
    public_net_access:
        name: oai-public-access
        external: true
