services:
    mysql:
        container_name: "mysql"
        image: dreibh/mysql:latest
        volumes:
            - ./database/simulamet-oai_db2.sql:/docker-entrypoint-initdb.d/oai_db.sql
            - ./healthscripts/mysql-healthcheck2.sh:/tmp/mysql-healthcheck.sh
        environment:
            - TZ=Europe/Paris
            - MYSQL_DATABASE=oai_db
            - MYSQL_USER=test
            - MYSQL_PASSWORD=test
            - MYSQL_ROOT_PASSWORD=linux
        healthcheck:
            test: /bin/bash -c "/tmp/mysql-healthcheck.sh"
            interval: 10s
            timeout: 5s
            retries: 30
        networks:
            public_net:
                ipv4_address: 192.168.200.131
    oai-udr:
        container_name: "oai-udr"
        image: dreibh/oai-udr:develop
        expose:
            - 80/tcp
            - 8080/tcp
        volumes:
            - ./conf/simulamet-ulcl_config.yaml:/openair-udr/etc/config.yaml
        environment:
            - TZ=Europe/Paris
        depends_on:
            - mysql
            - oai-nrf
        networks:
            public_net:
                ipv4_address: 192.168.200.136
    oai-udm:
        container_name: "oai-udm"
        image: dreibh/oai-udm:develop
        expose:
            - 80/tcp
            - 8080/tcp
        volumes:
            - ./conf/simulamet-ulcl_config.yaml:/openair-udm/etc/config.yaml
        environment:
            - TZ=Europe/Paris
        depends_on:
            - oai-udr
        networks:
            public_net:
                ipv4_address: 192.168.200.137
    oai-ausf:
        container_name: "oai-ausf"
        image: dreibh/oai-ausf:develop
        expose:
            - 80/tcp
            - 8080/tcp
        volumes:
            - ./conf/simulamet-ulcl_config.yaml:/openair-ausf/etc/config.yaml
        environment:
            - TZ=Europe/Paris
        depends_on:
            - oai-udm
        networks:
            public_net:
                ipv4_address: 192.168.200.138
    oai-nrf:
        container_name: "oai-nrf"
        image: dreibh/oai-nrf:develop
        expose:
            - 80/tcp
            - 8080/tcp
        volumes:
            - ./conf/simulamet-ulcl_config.yaml:/openair-nrf/etc/config.yaml
        environment:
            - TZ=Europe/Paris
        networks:
            public_net:
                ipv4_address: 192.168.200.130
    oai-amf:
        container_name: "oai-amf"
        image: dreibh/oai-amf:develop
        expose:
            - 80/tcp
            - 8080/tcp
            - 38412/sctp
        volumes:
            - ./conf/simulamet-ulcl_config.yaml:/openair-amf/etc/config.yaml
        environment:
            - TZ=Europe/Paris
        depends_on:
            - mysql
            - vpp-upf
            - oai-ext-dn
            - oai-ausf
        networks:
            public_net:
                ipv4_address: 192.168.200.132
    oai-smf:
        container_name: "oai-smf"
        image: dreibh/oai-smf:develop
        expose:
            - 80/tcp
            - 8080/tcp
            - 8805/udp
        volumes:
            - ./conf/simulamet-ulcl_config.yaml:/openair-smf/etc/config.yaml
        environment:
            - TZ=Europe/Paris
        extra_hosts:
            - "vpp-upf.node.5gcn.mnc88.mcc242.3gppnetwork.org:192.168.200.201"
        depends_on:
            - oai-amf
        networks:
            public_net:
                ipv4_address: 192.168.200.133
    oai-pcf:
        container_name: "oai-pcf"
        image: dreibh/oai-pcf:develop
        expose:
            - 80/tcp
            - 8080/tcp
        volumes:
            - ./simulamet-policies/redirection:/openair-pcf/policies
            - ./conf/simulamet-ulcl_config.yaml:/openair-pcf/etc/config.yaml
        environment:
            - TZ=Europe/Paris
        depends_on:
            - oai-nrf
        networks:
            public_net:
                ipv4_address: 192.168.200.139
    vpp-upf:
        privileged: true
        container_name: "vpp-upf"
        image: dreibh/oai-upf-vpp:develop
        environment:
            - IF_1_IP=192.168.200.201
            - IF_1_TYPE=N4
            - IF_2_IP=192.168.202.201
            - IF_2_TYPE=N3
            - IF_2_NWI=access.oai.org
            - IF_2_DNAI=access
            - IF_3_IP=192.168.203.201
            - IF_3_TYPE=N6
            - IF_3_IP_REMOTE=192.168.203.135
            - IF_3_NWI=internet.oai.org
            - IF_3_DNAI=internet
            - NAME=VPP-UPF
            - MNC=88
            - MCC=242
            - REALM=3gppnetwork.org
            - VPP_MAIN_CORE=0
            - VPP_CORE_WORKER=1
            - VPP_PLUGIN_PATH=/usr/lib/x86_64-linux-gnu/vpp_plugins/
            - SNSSAI_SD=00007B
            - SNSSAI_SST=222
            - DNN=default
            - REGISTER_NRF=yes
            - NRF_IP_ADDR=192.168.200.130
            - NRF_PORT=8080
            - HTTP_VERSION=2
        depends_on:
            - oai-nrf
        healthcheck:
            test: /bin/bash -c "pgrep vpp"
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            public_net:
                ipv4_address: 192.168.200.134
            public_net_access:
                ipv4_address: 192.168.202.134
            public_net_core:
                ipv4_address: 192.168.203.134
    oai-ext-dn:
        privileged: true
        init: true
        container_name: "oai-ext-dn"
        image: dreibh/trf-gen-cn5g:latest
        entrypoint: /bin/bash -c \ "iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE;"\
            "ip route add 12.1.1.0/24 via 192.168.203.201 dev eth0; ip route; sleep infinity"
        command: ["/bin/bash", "-c", "trap : SIGTERM SIGINT; sleep infinity & wait"]
        healthcheck:
            test: /bin/bash -c "iptables -L -t nat | grep MASQUERADE"
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            public_net_core:
                ipv4_address: 192.168.203.135
networks:
    public_net:
        driver: macvlan
        name: demo-oai-public-net
        ipam:
            config:
                - subnet: 192.168.200.0/24
        driver_opts:
            com.docker.network.bridge.name: "demo-oai"
            parent: vxlan
    public_net_access:
        name: oai-public-access
        ipam:
            config:
                - subnet: 192.168.202.0/24
        driver_opts:
            com.docker.network.bridge.name: "cn5g-access"
    public_net_core:
        name: oai-public-core
        ipam:
            config:
                - subnet: 192.168.203.0/24
        driver_opts:
            com.docker.network.bridge.name: "cn5g-core"
