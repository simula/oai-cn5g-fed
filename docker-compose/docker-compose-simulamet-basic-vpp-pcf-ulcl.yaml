services:
    mysql:
        container_name: "mysql"
        image: dreibh/mysql:latest
        volumes:
            - ./database/simulamet-oai_db2.sql:/docker-entrypoint-initdb.d/oai_db.sql
            - ./healthscripts/mysql-healthcheck2.sh:/tmp/mysql-healthcheck.sh
        environment:
            - TZ=Europe/Paris
            - MYSQL_DATABASE=oai_db
            - MYSQL_USER=test
            - MYSQL_PASSWORD=test
            - MYSQL_ROOT_PASSWORD=linux
        healthcheck:
            test: /bin/bash -c "/tmp/mysql-healthcheck.sh"
            interval: 10s
            timeout: 5s
            retries: 30
        networks:
            public_net:
                ipv4_address: 192.168.200.131
    oai-udr:
        container_name: "oai-udr"
        image: dreibh/oai-udr:develop
        expose:
            - 80/tcp
            - 8080/tcp
        volumes:
            - ./conf/simulamet-ulcl_config.yaml:/openair-udr/etc/config.yaml
        environment:
            - TZ=Europe/Paris
        depends_on:
            - mysql
            - oai-nrf
        networks:
            public_net:
                ipv4_address: 192.168.200.136
    oai-udm:
        container_name: "oai-udm"
        image: dreibh/oai-udm:develop
        expose:
            - 80/tcp
            - 8080/tcp
        volumes:
            - ./conf/simulamet-ulcl_config.yaml:/openair-udm/etc/config.yaml
        environment:
            - TZ=Europe/Paris
        depends_on:
            - oai-nrf
        networks:
            public_net:
                ipv4_address: 192.168.200.137
    oai-ausf:
        container_name: "oai-ausf"
        image: dreibh/oai-ausf:develop
        expose:
            - 80/tcp
            - 8080/tcp
        volumes:
            - ./conf/simulamet-ulcl_config.yaml:/openair-ausf/etc/config.yaml
        environment:
            - TZ=Europe/Paris
        depends_on:
            - oai-nrf
        networks:
            public_net:
                ipv4_address: 192.168.200.138
    oai-nrf:
        container_name: "oai-nrf"
        image: dreibh/oai-nrf:develop
        expose:
            - 80/tcp
            - 8080/tcp
        volumes:
            - ./conf/simulamet-ulcl_config.yaml:/openair-nrf/etc/config.yaml
        environment:
            - TZ=Europe/Paris
        networks:
            public_net:
                ipv4_address: 192.168.200.130
    oai-amf:
        container_name: "oai-amf"
        image: dreibh/oai-amf:develop
        expose:
            - 80/tcp
            - 8080/tcp
            - 38412/sctp
        volumes:
            - ./conf/simulamet-ulcl_config.yaml:/openair-amf/etc/config.yaml
        environment:
            - TZ=Europe/Paris
        depends_on:
            - mysql
            - oai-nrf
        networks:
            public_net:
                ipv4_address: 192.168.200.132
    oai-smf:
        container_name: "oai-smf"
        image: dreibh/oai-smf:develop
        expose:
            - 80/tcp
            - 8080/tcp
            - 8805/udp
        volumes:
            - ./conf/simulamet-ulcl_config.yaml:/openair-smf/etc/config.yaml
        environment:
            - TZ=Europe/Paris
        extra_hosts:
            - "ulcl.node.5gcn.mnc88.mcc242.3gppnetwork.org:192.168.200.201"
            - "aupf1.node.5gcn.mnc88.mcc242.3gppnetwork.org:192.168.200.202"
            - "aupf2.node.5gcn.mnc88.mcc242.3gppnetwork.org:192.168.200.203"
        depends_on:
            - oai-nrf
        networks:
            public_net:
                ipv4_address: 192.168.200.133
    oai-pcf:
        container_name: "oai-pcf"
        image: dreibh/oai-pcf:develop
        expose:
            - 80/tcp
            - 8080/tcp
        volumes:
            - ./simulamet-policies/ulcl:/openair-pcf/policies
            - ./conf/simulamet-ulcl_config.yaml:/openair-pcf/etc/config.yaml
        environment:
            - TZ=Europe/Paris
        depends_on:
            - oai-nrf
        networks:
            public_net:
                ipv4_address: 192.168.200.139
    vpp-upf-ulcl:
        container_name: "vpp-upf-ulcl"
        image: dreibh/oai-upf-vpp:develop
        privileged: true
        environment:
            - IF_1_IP=192.168.200.201
            - IF_1_TYPE=N4
            - IF_2_IP=192.168.202.201
            - IF_2_TYPE=N3
            - IF_2_NWI=access.5gcn.mnc88.mcc242.3gppnetwork.org
            - IF_2_DNAI=access
            - IF_3_IP=192.168.203.201
            - IF_3_TYPE=N9
            - IF_3_NWI=aupf1.node.5gcn.mnc88.mcc242.3gppnetwork.org
            - IF_3_DNAI=aupf1
            - IF_4_IP=192.168.204.201
            - IF_4_TYPE=N9
            - IF_4_NWI=aupf2.node.5gcn.mnc88.mcc242.3gppnetwork.org
            - IF_4_DNAI=aupf2
            - NAME=ULCL
            - MNC=88
            - MCC=242
            - REALM=3gppnetwork.org
            - VPP_MAIN_CORE=0
            - VPP_CORE_WORKER=1
            - VPP_PLUGIN_PATH=/usr/lib/x86_64-linux-gnu/vpp_plugins/
            - SNSSAI_SD=00007B
            - SNSSAI_SST=222
            - DNN=default
            - REGISTER_NRF=yes
            - NRF_IP_ADDR=192.168.200.130
            - NRF_PORT=8080
            - HTTP_VERSION=2
        depends_on:
            - oai-nrf
        healthcheck:
            test: /bin/bash -c "pgrep vpp"
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            public_net:
                ipv4_address: 192.168.200.151
            public_net_access:
                ipv4_address: 192.168.202.151
            public_net_core11:
                ipv4_address: 192.168.203.151
            public_net_core21:
                ipv4_address: 192.168.204.151
    vpp-upf-aupf1:
        image: dreibh/oai-upf-vpp:develop
        privileged: true
        container_name: "vpp-upf-aupf1"
        environment:
            - IF_1_IP=192.168.200.202
            - IF_1_TYPE=N4
            - IF_2_IP=192.168.203.202
            - IF_2_TYPE=N9
            - IF_2_NWI=ulcl.node.5gcn.mnc88.mcc242.3gppnetwork.org
            - IF_2_DNAI=ulcl
            - IF_3_IP=192.168.205.202
            - IF_3_TYPE=N6
            - IF_3_NWI=internet.5gcn.mnc88.mcc242.3gppnetwork.org
            - IF_3_DNAI=internet
            - IF_3_IP_REMOTE=192.168.205.160
            - NAME=AUPF1
            - MNC=88
            - MCC=242
            - REALM=3gppnetwork.org
            - VPP_MAIN_CORE=2
            - VPP_CORE_WORKER=3
            - VPP_PLUGIN_PATH=/usr/lib/x86_64-linux-gnu/vpp_plugins/
            - SNSSAI_SD=00007B
            - SNSSAI_SST=222
            - DNN=default
            - REGISTER_NRF=yes
            - NRF_IP_ADDR=192.168.200.130
            - NRF_PORT=8080
            - HTTP_VERSION=2
        depends_on:
            - oai-nrf
        healthcheck:
            test: /bin/bash -c "pgrep vpp"
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            public_net:
                ipv4_address: 192.168.200.152
            public_net_core11:
                ipv4_address: 192.168.203.152
            public_net_core12:
                ipv4_address: 192.168.205.152
    vpp-upf-aupf2:
        image: dreibh/oai-upf-vpp:develop
        privileged: true
        container_name: "vpp-upf-aupf2"
        environment:
            - IF_1_IP=192.168.200.203
            - IF_1_TYPE=N4
            - IF_2_IP=192.168.204.203
            - IF_2_TYPE=N9
            - IF_2_NWI=ulcl.node.5gcn.mnc88.mcc242.3gppnetwork.org
            - IF_2_DNAI=ulcl
            - IF_3_IP=192.168.206.203
            - IF_3_TYPE=N6
            - IF_3_NWI=edge.5gcn.mnc88.mcc242.3gppnetwork.org
            - IF_3_DNAI=edge
            - IF_3_IP_REMOTE=192.168.206.160
            - NAME=AUPF2
            - MNC=88
            - MCC=242
            - REALM=3gppnetwork.org
            - VPP_MAIN_CORE=4
            - VPP_CORE_WORKER=5
            - VPP_PLUGIN_PATH=/usr/lib/x86_64-linux-gnu/vpp_plugins/
            - SNSSAI_SD=00007B
            - SNSSAI_SST=222
            - DNN=default
            - REGISTER_NRF=yes
            - NRF_IP_ADDR=192.168.200.130
            - NRF_PORT=8080
            - HTTP_VERSION=2
        depends_on:
            - oai-nrf
        healthcheck:
            test: /bin/bash -c "pgrep vpp"
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            public_net:
                ipv4_address: 192.168.200.153
            public_net_core21:
                ipv4_address: 192.168.204.153
            public_net_core22:
                ipv4_address: 192.168.206.153
    oai-ext-dn-internet:
        image: dreibh/trf-gen-cn5g:latest
        privileged: true
        init: true
        container_name: "oai-ext-dn-internet"
        entrypoint: /bin/bash -c \ "iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE;"\
            "ip route add 12.1.1.0/24 via 192.168.205.202 dev eth0; ip route; sleep infinity"
        command: ["/bin/bash", "-c", "trap : SIGTERM SIGINT; sleep infinity & wait"]
        healthcheck:
            test: /bin/bash -c "iptables -L -t nat | grep MASQUERADE"
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            public_net_core12:
                ipv4_address: 192.168.205.160
    oai-ext-dn-edge:
        image: dreibh/trf-gen-cn5g:latest
        privileged: true
        init: true
        container_name: "oai-ext-dn-edge"
        entrypoint: /bin/bash -c \ "iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE;"\
            "ip route add 12.1.1.0/24 via 192.168.206.203 dev eth0; ip route; sleep infinity"
        command: ["/bin/bash", "-c", "trap : SIGTERM SIGINT; sleep infinity & wait"]
        healthcheck:
            test: /bin/bash -c "iptables -L -t nat | grep MASQUERADE"
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            public_net_core22:
                ipv4_address: 192.168.206.160
networks:
    public_net:
        driver: macvlan
        name: demo-oai-public-net
        ipam:
            config:
                - subnet: 192.168.200.0/24
        driver_opts:
            com.docker.network.bridge.name: "demo-oai"
            parent: vxlan
    public_net_access:
        name: oai-public-access
        ipam:
            config:
                - subnet: 192.168.202.0/24
        driver_opts:
            com.docker.network.bridge.name: "cn5g-access"
    public_net_core11:
        name: oai-public-core11
        ipam:
            config:
                - subnet: 192.168.203.0/24
        driver_opts:
            com.docker.network.bridge.name: "cn5g-core-11"
    public_net_core21:
        name: oai-public-core21
        ipam:
            config:
                - subnet: 192.168.204.0/24
        driver_opts:
            com.docker.network.bridge.name: "cn5g-core-21"
    public_net_core12:
        name: oai-public-core12
        ipam:
            config:
                - subnet: 192.168.205.0/24
        driver_opts:
            com.docker.network.bridge.name: "cn5g-core-12"
    public_net_core22:
        name: oai-public-core22
        ipam:
            config:
                - subnet: 192.168.206.0/24
        driver_opts:
            com.docker.network.bridge.name: "cn5g-core-22"
