services:
    ueransim:
        container_name: ueransim
        image: ueransim:latest
        privileged: true
        environment:
            - MCC=242
            - MNC=88
            - NCI=0x000000010
            - TAC=0xa000
            - LINK_IP=192.168.200.152
            - NGAP_IP=192.168.200.152
            - GTP_IP=192.168.200.152
            - NGAP_PEER_IP=192.168.200.138
            - SST=128
            - SD=128
            - SST_0=128
            - SD_0=128
            - SST_1=1
            - SD_1=0
            - SST_2=131
            - SD_2=131
            - IGNORE_STREAM_IDS=true
            - NUMBER_OF_UE=1
            - IMSI=242881234500035
            - KEY=449c4b91aeacd0ace182cf3a5a72bfa1
            - OP=9245cd6283cc53ce24ac1186a60dee6b
            - OP_TYPE=OPC
            - AMF_VALUE=8000
            - IMEI=356938035643803
            - IMEI_SV=0035609204079514
            - GNB_IP_ADDRESS=192.168.200.152
            - PDU_TYPE=IPv4
            - APN=default
            - SST_R=128
            - SD_R=128
            - SST_C=128
            - SD_C=128
            - SST_D=128
            - SD_D=128
        networks:
            public_net:
                ipv4_address: 192.168.200.152
        healthcheck:
            test: /bin/bash -c "ifconfig uesimtun0"
            interval: 10s
            timeout: 5s
            retries: 5
    oai-gnb:
        image: dreibh/oai-gnb:develop
        privileged: true
        container_name: rfsim5g-oai-gnb
        environment:
            RFSIMULATOR: server
            USE_ADDITIONAL_OPTIONS: -E --rfsim --log_config.global_log_options level,nocolor,time
        volumes:
            - ./ran-conf/simulamet-gnb.conf:/opt/oai-gnb/etc/gnb.conf
        networks:
            public_net:
                ipv4_address: 192.168.200.153
        healthcheck:
            test: /bin/bash -c "pgrep nr-softmodem"
            interval: 10s
            timeout: 5s
            retries: 5
    oai-nr-ue1:
        image: dreibh/oai-nr-ue:develop
        privileged: true
        container_name: rfsim5g-oai-nr-ue1
        environment:
            RFSIMULATOR: 192.168.200.153
            USE_ADDITIONAL_OPTIONS: -E --rfsim -r 106 --numerology 1 -C 3619200000 --log_config.global_log_options
                level,nocolor,time
        depends_on:
            - oai-gnb
        volumes:
            - ./ran-conf/simulamet-nr-ue.conf:/opt/oai-nr-ue/etc/nr-ue.conf
        networks:
            public_net:
                ipv4_address: 192.168.200.154
        healthcheck:
            test: /bin/bash -c "pgrep nr-uesoftmodem"
            interval: 10s
            timeout: 5s
            retries: 5
    gnbsim:
        container_name: gnbsim
        image: gnbsim:latest
        privileged: true
        environment:
            - MCC=242
            - MNC=88
            - GNBID=5
            - TAC=0x00a000
            - SST=130
            - SD=000082
            - PagingDRX=v32
            - RANUENGAPID=0
            - IMEISV=35609204079514
            - MSIN=0000000037
            - RoutingIndicator=1234
            - ProtectionScheme=null
            - KEY=449c4b91aeacd0ace182cf3a5a72bfa1
            - OPc=9245cd6283cc53ce24ac1186a60dee6b
            - DNN=oai.ipv4
            - URL=http://www.asnt.org:8080/
            - NRCellID=1
            - USE_FQDN=no
            - NGAPPeerAddr=192.168.200.138
            - GTPuLocalAddr=192.168.202.156
            - GTPuIFname=eth0
        networks:
            public_net:
                ipv4_address: 192.168.200.156
            public_net_access:
                ipv4_address: 192.168.202.156
        healthcheck:
            test: /bin/bash -c "ip address show dev gtp-gnb"
            interval: 10s
            timeout: 5s
            retries: 5
networks:
    public_net:
        name: demo-oai-public-net
        external: true
    public_net_access:
        name: oai-public-access
        external: true
